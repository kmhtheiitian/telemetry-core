<!DOCTYPE html>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    colors: {
                        brand: {
                            50: 'rgb(var(--brand-50-rgb) / <alpha-value>)',
                            100: 'rgb(var(--brand-100-rgb) / <alpha-value>)',
                            400: 'rgb(var(--brand-400-rgb) / <alpha-value>)',
                            500: 'rgb(var(--brand-500-rgb) / <alpha-value>)',
                            600: 'rgb(var(--brand-600-rgb) / <alpha-value>)',
                            700: 'rgb(var(--brand-700-rgb) / <alpha-value>)',
                            800: 'rgb(var(--brand-800-rgb) / <alpha-value>)',
                            900: 'rgb(var(--brand-900-rgb) / <alpha-value>)'
                        }
                    }
                }
            }
        };

        const savedTheme = localStorage.getItem('pulse-theme-mode') || 'dark';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        const savedColor = localStorage.getItem('pulse-color-theme') || 'violet';
        document.documentElement.setAttribute('data-color', savedColor);
    </script>
</head>
<body class="min-h-screen flex flex-col antialiased select-none">

        <div class="flex items-center gap-2 sm:gap-3">

            </button>

            <!-- Color Palette Switcher -->
            <div class="relative">
                <button onclick="toggleColorPalettePopover()" id="btn-profile-palette" class="w-9 h-9 rounded-xl flex items-center justify-center bg-slate-200/70 dark:bg-white/10 hover:bg-slate-300 dark:hover:bg-white/15 text-slate-700 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 transition-all group" title="Choose Color Accent">

                <i class="ph-fill ph-chat-circle-dots text-brand-600 dark:text-brand-400 text-sm"></i>

    <main class="flex-grow flex items-center justify-center p-3 sm:p-6 md:p-8">
        <div class="bg-white/90 dark:bg-[#160e26]/90 backdrop-blur-xl border border-slate-200/80 dark:border-white/10 rounded-3xl sm:rounded-[32px] shadow-2xl max-w-lg w-full overflow-hidden transition-all relative">
            
            <!-- Banner Cover with Dynamic Palette Gradient -->

                <div class="absolute inset-0 bg-[radial-gradient(circle_at_30%_30%,rgba(255,255,255,0.18),transparent)]"></div>
                <div class="absolute inset-0 bg-black/25"></div>

                            <div id="profile-avatar" class="w-24 h-24 sm:w-32 sm:h-32 rounded-full overflow-hidden bg-gradient-to-tr from-brand-700 via-brand-800 to-indigo-800 text-white font-extrabold text-3xl sm:text-5xl flex items-center justify-center uppercase shadow-inner ring-4 ring-brand-500/30 transition-all">

                <!-- Direct Action Buttons Row -->
                <div class="flex items-center justify-center gap-2 sm:gap-2.5 mb-5 sm:mb-6">

                    <button onclick="toggleBlockUser()" id="btn-block-toggle" class="px-3.5 sm:px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all border border-rose-200 dark:border-rose-900/50 bg-rose-50 dark:bg-rose-950/30 text-rose-600 dark:text-rose-400 hover:bg-rose-600 hover:text-white dark:hover:bg-rose-600 flex items-center justify-center gap-1.5 active:scale-95">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            getDoc, 
            getDocs,
            setDoc,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'pulse-relay-core';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyB3CuxOTGTIcfkuRUrmQSLhYgmM5fs8oiA",
                authDomain: "telementry-core.firebaseapp.com",
                projectId: "telementry-core",
                storageBucket: "telementry-core.firebasestorage.app",
                messagingSenderId: "383674921170",
                appId: "1:383674921170:web:6494651de6757df5c0fd0b"
            };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentAuthUser = null;
        let targetPilotData = null;
        let isBlocked = false;

        const urlParams = new URLSearchParams(window.location.search);
        const targetQuery = urlParams.get('uid') || urlParams.get('code') || urlParams.get('id');

        window.toggleThemeMode = () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('pulse-theme-mode', isDark ? 'dark' : 'light');
            showToast(isDark ? "Dark Mode active" : "Crisp Light Mode active");
        };

        const PALETTE_THEMES = [
            { id: 'violet', name: 'Cosmic Violet', color: '#7c3aed' },
            { id: 'pink',   name: 'Cyber Pink',    color: '#ec4899' },
            { id: 'red',    name: 'Crimson Nova',  color: '#ef4444' },
            { id: 'green',  name: 'Emerald Matrix',color: '#10b981' },
            { id: 'blue',   name: 'Ocean Cyan',    color: '#06b6d4' },
            { id: 'amber',  name: 'Solar Amber',   color: '#f59e0b' }
        ];

        window.toggleColorPalettePopover = () => {
            const popover = document.getElementById('profile-palette-popover');
            if (!popover) return;
            const isClosed = popover.classList.contains('hidden');
            if (isClosed) {
                renderPaletteChoices();
                popover.classList.remove('hidden');
            } else {
                popover.classList.add('hidden');
            }
        };

        function renderPaletteChoices() {
            const container = document.getElementById('profile-palette-choices-list');
            if (!container) return;
            const current = document.documentElement.getAttribute('data-color') || 'violet';
            
            container.innerHTML = PALETTE_THEMES.map(t => {
                const isActive = t.id === current;
                return `
                    <button onclick="setColorTheme('${t.id}')" class="w-full flex items-center justify-between p-2 rounded-xl text-xs font-semibold transition-all ${isActive ? 'bg-brand-500/20 text-slate-900 dark:text-white font-bold' : 'hover:bg-slate-100 dark:hover:bg-white/5 text-slate-600 dark:text-slate-300'}">
                        <div class="flex items-center gap-2.5">
                            <span class="w-3.5 h-3.5 rounded-full shadow-sm flex-shrink-0" style="background-color: ${t.color}"></span>
                            <span>${t.name}</span>
                        </div>
                        ${isActive ? '<i class="ph-bold ph-check text-brand-600 dark:text-brand-400 text-xs"></i>' : ''}
                    </button>
                `;
            }).join('');
        }

        window.setColorTheme = (themeId) => {
            document.documentElement.setAttribute('data-color', themeId);
            localStorage.setItem('pulse-color-theme', themeId);
            renderPaletteChoices();
            const popover = document.getElementById('profile-palette-popover');
            if (popover) popover.classList.add('hidden');
            
            const themeObj = PALETTE_THEMES.find(t => t.id === themeId);
            showToast(`${themeObj ? themeObj.name : themeId} theme active`);
        };

        window.addEventListener('click', (e) => {
            const popover = document.getElementById('profile-palette-popover');
            const btn = document.getElementById('btn-profile-palette');
            if (popover && !popover.classList.contains('hidden')) {
                if (!popover.contains(e.target) && !btn?.contains(e.target)) {
                    popover.classList.add('hidden');
                }
            }
        });

        onAuthStateChanged(auth, async (user) => {
            currentAuthUser = user;
            if (targetQuery) {
                await loadPilotProfile(targetQuery);
            } else if (user) {
                await loadPilotProfile(user.uid);
            } else {
                showLoggedOutState();
            }
        });

        async function loadPilotProfile(queryId) {
            try {
                let foundUserDoc = null;
                const cleanQuery = queryId.trim().toLowerCase().replace(/^#/, '');

                const directRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'users_directory', queryId);
                const directSnap = await getDoc(directRef);

                if (directSnap.exists()) {
                    foundUserDoc = directSnap.data();
                } else {
                    const usersSnap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'users_directory'));
                    usersSnap.forEach(d => {
                        const u = d.data();
                        if ((u.pilotCode || '').toLowerCase() === cleanQuery || 
                            (u.email || '').toLowerCase() === cleanQuery || 
                            (u.uid || '').toLowerCase() === cleanQuery) {
                            foundUserDoc = u;
                        }
                    });
                }

                if (foundUserDoc) {
                    targetPilotData = foundUserDoc;
                    renderProfile(foundUserDoc);
                    if (currentAuthUser) {
                        checkBlockStatus(currentAuthUser.uid, foundUserDoc.uid);
                        fetchCommonGroups(currentAuthUser.uid, foundUserDoc.uid);
                    }
                } else {
                    showPilotNotFound(queryId);
                }
            } catch(e) {
                console.warn("Profile load notice:", e);
                showPilotNotFound(queryId);
            }
        }

        function renderProfile(user) {
            const isMe = currentAuthUser && currentAuthUser.uid === user.uid;
            const displayName = user.displayName || 'Pilot ' + (user.pilotCode || 'Unknown');
            const mailId = user.email || (user.isAnonymous ? 'Guest Pilot' : 'Private');
            const code = user.pilotCode || '------';
            const letter = displayName.charAt(0).toUpperCase();

            document.getElementById('profile-display-name').innerText = displayName;
            document.getElementById('profile-handle').innerText = `@${code.toLowerCase()}`;
            document.getElementById('profile-mail-id').innerText = mailId;
            document.getElementById('profile-user-id').innerText = `#${code}`;
            
            const avatar = document.getElementById('profile-avatar');
            const photoUrl = user.customPhotoUrl || user.photoURL || '';

            if (photoUrl && !photoUrl.startsWith('data:text')) {
                avatar.innerHTML = `<img src="${photoUrl}" alt="${escapeHTML(displayName)}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerText='${letter}';">`;
            } else {
                avatar.innerText = letter;
            }

            const defaultBio = user.bio || "✨ Member of Pulse Relay\n💬 Real-time Communication & Messaging\n📍 Active Community Member";
            document.getElementById('profile-bio-text').innerText = defaultBio;

            const bioLink = user.website || `pulserelay.mesh/${code.toLowerCase()}`;
            const linkElem = document.getElementById('profile-bio-link');
            linkElem.innerText = bioLink.replace(/^https?:\/\//, '');
            linkElem.href = bioLink.startsWith('http') ? bioLink : `https://${bioLink}`;

            const dmBtnText = document.getElementById('dm-btn-text');
            const blockBtn = document.getElementById('btn-block-toggle');
            if (isMe) {
                if (dmBtnText) dmBtnText.innerText = "Back to Messenger";
                if (blockBtn) blockBtn.classList.add('hidden');
            } else {
                if (dmBtnText) dmBtnText.innerText = "Send Transmission";
                if (blockBtn) blockBtn.classList.remove('hidden');
            }
        }

        function showLoggedOutState() {
            document.getElementById('profile-display-name').innerText = "Session Required";
            document.getElementById('profile-handle').innerText = "@unauthenticated";
            document.getElementById('profile-mail-id').innerText = "Sign in to view";
            document.getElementById('profile-user-id').innerText = "#------";
            
            const avatar = document.getElementById('profile-avatar');
            avatar.innerHTML = `<i class="ph-bold ph-lock-key text-3xl"></i>`;

            document.getElementById('profile-bio-text').innerText = "You are currently logged out.\nPlease sign in to Pulse Relay to view your pilot dossier, squad rosters, and conversation threads.";

            const linkElem = document.getElementById('profile-bio-link');
            if (linkElem) {
                linkElem.innerText = "pulserelay.mesh/auth";
                linkElem.href = "index.html?auth=true";
            }

            const dmBtn = document.getElementById('btn-dm-user');
            const dmBtnText = document.getElementById('dm-btn-text');
            const blockBtn = document.getElementById('btn-block-toggle');
            
            if (dmBtnText) dmBtnText.innerText = "Sign In to Pulse Relay";
            if (dmBtn) dmBtn.onclick = () => { window.location.href = "index.html?auth=true"; };
            if (blockBtn) blockBtn.classList.add('hidden');

            const statusText = document.getElementById('user-status-text');
            const statusDot = document.getElementById('user-status-indicator');
            if (statusText) statusText.innerText = "Logged Out";
            if (statusDot) statusDot.className = "w-2 h-2 rounded-full bg-amber-400";

            const container = document.getElementById('common-groups-list');
            if (container) {
                container.innerHTML = `
                    <div class="p-3.5 rounded-2xl bg-slate-100/80 dark:bg-white/5 border border-dashed border-slate-300 dark:border-white/10 text-center">
                        <p class="text-xs text-slate-500">Sign in to sync your squads.</p>
                    </div>`;
            }
        }

        function showPilotNotFound(query = '') {
            const clean = query.replace(/^#/, '');
            document.getElementById('profile-display-name').innerText = "Pilot Not Found";
            document.getElementById('profile-handle').innerText = `@${clean.toLowerCase() || 'unknown'}`;
            document.getElementById('profile-mail-id').innerText = "N/A";
            document.getElementById('profile-user-id').innerText = `#${clean.toUpperCase() || '------'}`;
            
            const avatar = document.getElementById('profile-avatar');
            avatar.innerText = "?";

            document.getElementById('profile-bio-text').innerText = `No pilot dossier was found matching ID or callsign "${clean}".`;
            
            const dmBtnText = document.getElementById('dm-btn-text');
            const dmBtn = document.getElementById('btn-dm-user');
            const blockBtn = document.getElementById('btn-block-toggle');
            if (dmBtnText) dmBtnText.innerText = "Back to Messenger";
            if (dmBtn) dmBtn.onclick = () => goBackToMainApp();
            if (blockBtn) blockBtn.classList.add('hidden');
        }

        async function fetchCommonGroups(myUid, targetUid) {
            const container = document.getElementById('common-groups-list');
            const countBadge = document.getElementById('common-groups-count');

            try {
                const groupsSnap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'account_groups'));
                const shared = [];

                groupsSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    const members = data.members || [];
                    if (members.includes(myUid) && members.includes(targetUid)) {
                        shared.push({ id: docSnap.id, ...data });
                    }
                });

                countBadge.innerText = `${shared.length} Shared`;

                if (shared.length === 0) {
                    container.innerHTML = `
                        <div class="p-3.5 rounded-2xl bg-slate-100/80 dark:bg-white/5 border border-dashed border-slate-300 dark:border-white/10 text-center">
                            <p class="text-xs text-slate-500">No common squad groups shared with this pilot.</p>
                        </div>`;
                    return;
                }

                container.innerHTML = '';
                shared.forEach(group => {
                    const item = document.createElement('div');
                    item.className = "flex items-center justify-between p-3 rounded-2xl bg-slate-100/80 dark:bg-white/5 border border-slate-200/80 dark:border-white/10";
                    item.innerHTML = `
                        <div class="flex items-center gap-2.5 truncate">
                            <div class="w-8 h-8 rounded-xl bg-brand-500/20 text-brand-600 dark:text-brand-400 flex items-center justify-center flex-shrink-0">
                                <i class="ph-fill ph-users-three text-base"></i>
                            </div>
                            <div class="truncate">
                                <p class="text-xs font-bold text-slate-900 dark:text-white truncate">${escapeHTML(group.name)}</p>
                                <p class="text-[10px] text-slate-500 dark:text-slate-400 truncate">${group.description || (group.members.length + ' members')}</p>
                            </div>
                        </div>
                        <span class="text-[9px] font-mono font-bold px-2 py-0.5 rounded-md bg-slate-200 dark:bg-white/10 text-slate-600 dark:text-slate-300 flex-shrink-0">Shared</span>
                    `;
                    container.appendChild(item);
                });
            } catch(e) {
                console.warn("Notice fetching common groups:", e);
            }
        }

        async function checkBlockStatus(myUid, targetUid) {
            try {
                const blockRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'blocked_users', `${myUid}_${targetUid}`);
                const blockSnap = await getDoc(blockRef);
                isBlocked = blockSnap.exists();
                updateBlockUI(isBlocked);
            } catch(e) {
                console.warn("Block status check notice:", e);
            }
        }

        window.toggleBlockUser = async () => {
            if (!targetPilotData) return;
            if (!currentAuthUser) {
                showToast("Please sign in to manage block settings.", true);
                return;
            }

            const myUid = currentAuthUser.uid;
            const targetUid = targetPilotData.uid;
            const blockRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'blocked_users', `${myUid}_${targetUid}`);

            try {
                if (isBlocked) {
                    await deleteDoc(blockRef);
                    isBlocked = false;
                    showToast(`Unblocked ${targetPilotData.displayName}`);
                } else {
                    await setDoc(blockRef, {
                        blockedBy: myUid,
                        blockedUser: targetUid,
                        timestamp: Date.now()
                    });
                    isBlocked = true;
                    showToast(`Blocked ${targetPilotData.displayName}.`);
                }
                updateBlockUI(isBlocked);
            } catch(e) {
                console.error("Block action failed:", e);
                showToast("Could not update block status.", true);
            }
        };

        function updateBlockUI(blocked) {
            const btn = document.getElementById('btn-block-toggle');
            const icon = document.getElementById('block-icon');
            const btnText = document.getElementById('block-btn-text');
            const badge = document.getElementById('blocked-badge');
            if (!btn) return;

            if (blocked) {
                badge?.classList.remove('hidden');
                btn.className = "px-3.5 sm:px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all bg-rose-600 text-white hover:bg-rose-700 flex items-center justify-center gap-1.5 shadow-md shadow-rose-600/20 active:scale-95";
                icon.className = "ph-bold ph-check text-sm";
                btnText.innerText = "Blocked";
            } else {
                badge?.classList.add('hidden');
                btn.className = "px-3.5 sm:px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all border border-rose-200 dark:border-rose-900/50 bg-rose-50 dark:bg-rose-950/30 text-rose-600 dark:text-rose-400 hover:bg-rose-600 hover:text-white dark:hover:bg-rose-600 flex items-center justify-center gap-1.5 active:scale-95";
                icon.className = "ph-bold ph-prohibit text-sm";
                btnText.innerText = "Block";
            }
        }

        window.startDirectChat = () => {
            if (!targetPilotData) {
                window.location.href = `index.html`;
                return;
            }
            if (currentAuthUser && currentAuthUser.uid === targetPilotData.uid) {
                window.location.href = `index.html`;
                return;
            }
            const code = targetPilotData.pilotCode || targetPilotData.uid;
            window.location.href = `index.html?dm=${encodeURIComponent(code)}`;
        };

        window.goBackToMainApp = () => {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = `index.html`;
            }
        };

        window.copyPilotId = () => {
            if (!targetPilotData) return;
            const text = targetPilotData.pilotCode || targetPilotData.uid;
            navigator.clipboard.writeText(text);
            showToast(`Pilot ID #${text} copied to clipboard!`);
        };

        function showToast(msg, isError = false) {
            const toast = document.createElement('div');
            const bg = isError ? 'bg-rose-600 text-white' : 'bg-slate-900 dark:bg-[#201438] text-white border border-slate-700 dark:border-brand-500/40 shadow-xl';
            const icon = isError ? 'ph-warning-circle' : 'ph-check-circle text-brand-400';

            toast.className = `fixed top-4 sm:top-6 left-1/2 transform -translate-x-1/2 ${bg} px-4 py-2.5 rounded-2xl shadow-2xl z-[300] transition-opacity duration-300 opacity-0 flex items-center gap-2.5 text-xs font-semibold max-w-sm w-11/12`;
            toast.innerHTML = `<i class="ph-bold ${icon} text-lg flex-shrink-0"></i> <span class="leading-snug truncate">${escapeHTML(msg)}</span>`;

            document.body.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0'), 20);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 250);
            }, 3500);
        }

        function escapeHTML(str) {
            const p = document.createElement('p');
            p.appendChild(document.createTextNode(str || ''));
            return p.innerHTML;
        }
    </script>
</body>
</html>
